name: Daily Security OSINT Collector

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python src/collector.py

      - name: Classify articles
        run: |
          python src/classifier_v2.py

      - name: Create report
        run: |
          python src/report.py
          
      - name: Create PDF
        run: |
          python src/pdf_report.py

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram_notify.py

      - name: Save results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add articles.json classified_articles_v2.json stats.json daily_report.md reports/
          git commit -m "Update daily security OSINT report" || exit 0
          git push
