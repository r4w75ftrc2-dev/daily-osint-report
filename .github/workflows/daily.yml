name: Daily OSINT Collector

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python collector.py
          
      - name: Classify articles
        run: |
          python classifier.py
      
      - name: Save classified results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add classified_articles.json
          git commit -m "Update classified articles" || exit 0
          git push
        
      - name: Save results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add articles.json
          git commit -m "Update collected articles" || exit 0
          git push
          
      - name: Create report
        run: |
          python report.py
